services:
  sre-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigapro-sre-agent
    restart: unless-stopped
    ports:
      - "${PORT:-3030}:3030"
    env_file:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .env
    networks:
      - coolify

networks:
  coolify:
    external: true
